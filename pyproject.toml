[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-md-cleaner"
version = "1.0.0"
description = "Convert native and scanned PDF documents into structured Markdown."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "PyMuPDF>=1.24",
    "pdfplumber>=0.11",
    "Pillow>=10.0",
    "pytesseract>=0.3.13",
    "opencv-python>=4.10",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
pdf-md-cleaner = "pdf_md_cleaner.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
]